    - generic [ref=f5e54]:
      - article [ref=f5e55]:
        - generic [ref=f5e56]:
          - heading "Team Registration" [level=2] [ref=f5e61]
          - list [ref=f5e62]:
            - listitem [ref=f5e63]:
              - generic [ref=f5e65]: "Eligibility: Bachelor's and Master's students currently pursuing degrees from Engineering, Science, Polytechnic, Arts, or Science colleges are eligible to participate."
            - listitem [ref=f5e66]:
              - generic [ref=f5e68]: Each team member must register with only one email ID.
            - listitem [ref=f5e69]:
              - generic [ref=f5e71]: Teams are NOT PERMITTED to change or replace any team member(s).
            - listitem [ref=f5e72]:
              - generic [ref=f5e74]: A team, once registered, will remain unchanged till the end of the competition.
      - article [ref=f5e75]:
        - generic [ref=f5e76]:
          - heading "Theme Assignment" [level=2] [ref=f5e81]
          - list [ref=f5e82]:
            - listitem [ref=f5e83]:
              - generic [ref=f5e85]: In Task 0, teams may explore all available themes and submit for any two themes of their choice.
            - listitem [ref=f5e86]:
              - generic [ref=f5e88]: Teams must continue with the same two themes through Tasks 1 and 2.
            - listitem [ref=f5e89]:
              - generic [ref=f5e91]: From Task 3 onwards, teams must select and commit to exactly one theme from their chosen two — no further changes are permitted.
            - listitem [ref=f5e92]:
              - generic [ref=f5e94]: e-Yantra holds complete discretion over theme availability and final assignments.
      - article [ref=f5e95]:
        - generic [ref=f5e96]:
          - heading "Robotic Kits Policy" [level=2] [ref=f5e101]
          - list [ref=f5e102]:
            - listitem [ref=f5e103]:
              - generic [ref=f5e105]: Robotic kits are provided at e-Yantra's expense to selected teams based on task performance, on a returnable basis.
            - listitem [ref=f5e106]:
              - generic [ref=f5e108]: Certificates will be issued only upon returning the kits.
      - article [ref=f5e109]:
        - generic [ref=f5e110]:
          - heading "Prize Money" [level=2] [ref=f5e115]
          - list [ref=f5e116]:
            - listitem [ref=f5e117]:
              - generic [ref=f5e119]: Prize money subject to selection of teams in Grand Finale of competition.
      - article [ref=f5e120]:
        - generic [ref=f5e121]:
          - heading "Publicity Consent" [level=2] [ref=f5e126]
          - list [ref=f5e127]:
            - listitem [ref=f5e128]:
              - generic [ref=f5e130]: All participants (implicitly) consent to allow their names and photographs to be used for publicity purposes by e-Yantra during and after the competition.
      - article [ref=f5e131]:
        - generic [ref=f5e132]:
          - heading "Intellectual Property" [level=2] [ref=f5e137]
          - list [ref=f5e138]:
            - listitem [ref=f5e139]:
              - generic [ref=f5e141]: All materials provided to teams by e-Yantra remain the intellectual property of e-Yantra.
            - listitem [ref=f5e142]:
              - generic [ref=f5e144]: All materials, solutions, and submissions made by participating teams for the competition become the intellectual property of e-Yantra.
            - listitem [ref=f5e145]:
              - generic [ref=f5e147]: Teams must not share, distribute, or use these materials for any purpose other than the competition without prior written consent from e-Yantra.
      - article [ref=f5e148]:
        - generic [ref=f5e149]:
          - heading "Material Responsibility" [level=2] [ref=f5e154]
          - list [ref=f5e155]:
            - listitem [ref=f5e156]:
              - generic [ref=f5e158]: e-Yantra is not responsible for any material lost in transit.
            - listitem [ref=f5e159]:
              - generic [ref=f5e161]: All material submitted must be a team's original work.
      - article [ref=f5e162]:
        - generic [ref=f5e163]:
          - heading "Plagiarism Policy" [level=2] [ref=f5e168]
          - list [ref=f5e169]:
            - listitem [ref=f5e170]:
              - generic [ref=f5e172]: Any kind of plagiarism is strictly prohibited and will lead to disqualification of a team.
            - listitem [ref=f5e173]:
              - generic [ref=f5e175]: Plagiarism is cheating. Provide proper citation for any idea, illustrations, graphs, diagrams or words taken from sources other than e-Yantra.
            - listitem [ref=f5e176]:
              - generic [ref=f5e178]: Teams from the same college must not knowingly or unknowingly share their code, solutions, or submissions with other teams. Such sharing will be treated as plagiarism and will result in disqualification of all involved teams.
      - article [ref=f5e179]:
        - generic [ref=f5e180]:
          - heading "Final Decision" [level=2] [ref=f5e185]
          - list [ref=f5e186]:
            - listitem [ref=f5e187]:
              - generic [ref=f5e189]: e-Yantra's decision in any matter relating to the competition is final and no appeals will be entertained.
            - listitem [ref=f5e190]:
              - generic [ref=f5e192]: e-Yantra reserves the right to modify or amend the prizes, rules, schedule, terms and conditions of the competition at any time.
