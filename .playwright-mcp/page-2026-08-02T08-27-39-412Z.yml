        - paragraph [ref=e118]: not adding -final to my directory names from now on.
        - paragraph [ref=e119]: 29 Jul 2026
        - generic [ref=e120]:
          - paragraph [ref=e121]: Jaipur — Six month ago I named a folder JARVIS-MK2-final
          - paragraph [ref=e122]: I genuinely believed it.
          - paragraph [ref=e123]: I had planned to make the core assistant, add some features, keep adding a feature or two here and there. I thought I had known what JARVIS was supposed to be.
          - paragraph [ref=e124]: Turns out I had only figured out what that version of me wanted it to be.
          - paragraph [ref=e125]: Today I am sketching out JARVIS MK3, and it shares surprisingly little with MK2. Different architecture. Different philosophy. Different goals.
          - paragraph [ref=e126]: Funny how projects evolve. You don’t just rewrite code—you rewrite assumptions.
          - paragraph [ref=e127]: I’ve stopped trying to build the “final version.” That phrase ages horribly.
          - paragraph [ref=e128]: I guess its just about reaching a point every now and then where I look at my old “Perfect version” and quietly smile before deleting half of the code.
