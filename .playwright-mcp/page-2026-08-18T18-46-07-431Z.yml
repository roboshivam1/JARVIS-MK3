        - heading "Introduction" [level=2] [ref=e72]
        - paragraph [ref=e75]: Gujarat Council on Science and Technology (GUJCOST) working under the aegis of the Dept. of Science and Technology, Govt. of Gujarat is the nodal agency for the S&T promotion, awareness, education, research and development through its various programmes and outreach activities across the state. GUJCOST is also the implementing agency of the Science, Technology and Innovation (STI) Policy of the State and is playing an important role by supporting research and development activities on emerging fields of Science and Technology and on state and national priority areas. In the STI policy, one of the identified emerging areas is Robotics and Artificial Intelligence. Presently, in Gujarat, very few engineering institutions are having separate specialization courses on Robotics and Artificial Intelligence. In order to explore more in this emerging field and to provide a skill set among students, GUJCOST proposes the organization of Robot Making Competition (ROBOFEST- GUJARAT 6.0) among students of STEM institutions in the country. The programme consists of three levels and in seven categories of robot making..
