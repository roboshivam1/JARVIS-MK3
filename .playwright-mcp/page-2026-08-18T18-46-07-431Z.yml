          - paragraph [ref=e127]: ROBOFEST Gujarat 6.0 is proposed to be a competition of autonomous robots with missions that aligns with the present day requirements of security, deep sea explorations, athletic precisions, autonomous driving and other humanitarian and educational purposes.
          - paragraph [ref=e128]: "Note : Each team shall comprise of 4 members and 1 mentor. One mentor can guide a maximum of 2 teams with max. 1 team for Robofest at either Junior/ Senior Level and 1 team of Hackathon. No student can participate in 2 different teams in the complete competition."
          - paragraph [ref=e129]: "Note : Mentors are advised not to submit more than one application at the same competition level. Submission of multiple applications by the same mentor at the same level may result in the disqualification of all teams registered under his/her mentorship."
