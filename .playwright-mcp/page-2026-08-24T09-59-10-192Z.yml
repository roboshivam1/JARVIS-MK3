        - heading "Our Success Stories" [level=1]
      - generic:
        - paragraph: At e-Yantra, we believe in empowering innovators and dreamers to turn their ideas into reality. Over the years, participants of our various initiatives have gone on to create impactful startups across diverse domains. These stories of success are a testament to the power of perseverance, innovation, and the unique opportunities provided by our competitions. Be inspired by the journeys of these changemakers who started with us and are now shaping the future.
      - generic [ref=e110]:
        - generic [ref=e111]:
          - generic [ref=e113]:
            - heading [level=3] [ref=e114]:
              - link "Advitiya Labs" [ref=e115] [cursor=pointer]:
                - /url: https://www.dronelok.in/
            - paragraph [ref=e116]: Advitiya was founded by a team of “Engineered Entrepreneurs” with a passion for innovation, invention, and imparting knowledge. We believe that the qualities of smartness, confidence and the enthusiasm to perform in every aspect of life have their origins in onecommon trait among innovators and explorers – experience through curiosity – the very trait and principle on which our products are envisaged. We develop products in multiple areas of Robotics, IoT, Embedded system and energy sector (Solar).
            - paragraph [ref=e117]: "Domains: Robotics, IoT, Solar Energy"
          - generic [ref=e119]:
            - heading [level=3] [ref=e120]:
              - link "Drona Automations" [ref=e121] [cursor=pointer]:
                - /url: https://dronaautomations.com/
            - paragraph [ref=e122]: Drona was started to give solutions to societal problems from Sewage To Space. Currently, Drona is into eliminating manual scavenging of manholes using low-cost and easy-to-use robots. Robots to clean and inspect sewer pipes of manholes and commercial buildings. The robot enters the pipes and cleans them for any blockages and scaling. They can be also used for inspection purposes. Robots can be used for pipe sizes ranging from 3 inches to 14 inches in diameter.
            - paragraph [ref=e123]: "Domains: Robotics, Social Impact"
          - generic [ref=e125]:
            - heading [level=3] [ref=e126]:
              - link "GOAT Robotics" [ref=e127] [cursor=pointer]:
                - /url: https://www.goat-robotics.com/
            - paragraph [ref=e128]: Established in late 2018 by a group of five intellectuals who came together from various backgrounds but with one vision. The company has made expeditious progress into the Singaporean Security Industry, deploying multiple technology products to enhance security workflows, digitalization of data with an alert-based real-time monitoring system. We further offer Autonomous Mobile Robots for various applications like security patrolling, cargo transfer, food serving robots for restaurants. Our customized solutions create values through the continuous expansion of our scope of services in the security solutions arena
            - paragraph [ref=e129]: "Domains: Robotics, Security Solutions"
