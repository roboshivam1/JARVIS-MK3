    - generic [ref=f6e31]:
      - paragraph [ref=f6e32]: The staff box
      - heading "Shivam Kapoor — editor, reporter, typesetter, and entire circulation department" [level=2] [ref=f6e33]
      - paragraph [ref=f6e34]: A life in parts, mostly unfinished, occasionally working.
      - generic [ref=f6e35]:
        - paragraph [ref=f6e36]:
          - text: I'm Shivam Kapoor. I live in Jaipur, I study computer science engineering at LNMIIT, and I build things.
          - generic [ref=f6e37]:
            - img "Shivam Kapoor" [ref=f6e39]
            - generic [ref=f6e40]: The editor.
        - paragraph [ref=f6e41]:
          - text: "That's the short version, and it's accurate, but it's also the kind of sentence that could belong to about four thousand people. So here's the long version — the one with the lime green website and the robot that cleaned air and the YouTube channel nobody watched. Fair warning: I've been at this a while, and I intend to mention almost all of it."
          - generic [ref=f6e42]:
            - generic [ref=f6e43]: Write to the editor
            - generic [ref=f6e44]:
              - text: "Email:"
              - link "roboshivam25@gmail.com" [ref=f6e45] [cursor=pointer]:
                - /url: mailto:roboshivam25@gmail.com
            - generic [ref=f6e46]:
              - text: "Elsewhere:"
              - link "GitHub," [ref=f6e47] [cursor=pointer]:
                - /url: https://github.com/roboshivam1
              - link "Instagram," [ref=f6e48] [cursor=pointer]:
                - /url: https://www.instagram.com/shivamkapoorthisside
              - link "LinkedIn" [ref=f6e49] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/shivam-kapoor-abc
            - generic [ref=f6e50]: Available for AI systems that have to survive contact with real users, internal tools, hardware-adjacent software, and second opinions on architecture before you commit to it.
        - heading "Before the electricity" [level=3] [ref=f6e51]
        - paragraph [ref=f6e52]: I don't remember deciding to become someone who makes things. As far as I can tell, I arrived that way.
        - paragraph [ref=f6e53]: "Toddler-me did art, crafts, models — anything that let me turn a pile of stuff into a slightly different pile of stuff with a name. Evenings were Lego with the neighbourhood crew. Weekends were board games, until board games stopped being enough and I started making my own versions of them: rewritten rules, hand-drawn boards, houses that were definitely not up to code. At some point I informed my family that I would be founding a board game company when I grew up."
        - paragraph [ref=f6e54]: I did not found a board game company. But I want it on record that the ambition was there early, and that I still think about it more than is reasonable.
        - heading "The robot kit" [level=3] [ref=f6e55]
        - paragraph [ref=f6e56]: Fifth grade. The fault line.
        - paragraph [ref=f6e57]:
          - text: My parents bought me a robot-building kit, and everything after this paragraph is downstream of it.
          - generic [ref=f6e58]: One of my first bots. This one played soccer.
        - paragraph [ref=f6e61]: The first robots were remote-controlled — I'd build them, drive them around, and then, because a working robot was apparently not enough, I'd sit down and draw new ones. Pages of robot designs, by hand, some of them genuinely impeccable. Nobody had told me CAD existed. I was doing mechanical design with a pencil and total confidence.
        - paragraph [ref=f6e62]:
          - text: The problem showed up fast. Everything I built had to be
          - emphasis [ref=f6e63]: driven
          - text: . I wanted them to think. And you can't solder your way to autonomy.
        - heading "HTML betrayed me" [level=3] [ref=f6e64]
        - paragraph [ref=f6e65]: Age ten.
        - paragraph [ref=f6e66]:
          - text: So I went looking for programming, and the first thing I found was HTML.
          - generic [ref=f6e67]: Version one of this paper. The art direction has changed.
        - paragraph [ref=f6e70]: I built a one-page website about myself — my hobbies, my interests, a giant cartoon robot, set against a solid lime green background that I maintain was a bold choice. It was, in every way that counts, the first version of the page you are currently reading. Twelve years of iteration and I'm still writing an about page with a robot on it.
        - paragraph [ref=f6e71]: Then I learned you cannot program a robot in HTML. I took this badly.
        - paragraph [ref=f6e72]: Python came next. I got myself into an introductory Python summer camp meant for 11th graders — a month of it, and I was by a distance the youngest person in the room. I left with the title of "most inquisitive student," which is the politest possible way to describe a ten-year-old who would not stop asking questions.
        - paragraph [ref=f6e73]:
          - text: That's where it started. Calculators. Number games. And then I found
          - code [ref=f6e74]: import
          - text: .
        - paragraph [ref=f6e75]:
          - text: I want to be dramatic about this, because it
          - emphasis [ref=f6e76]: was
          - text: dramatic. One keyword and the language stopped being a box and became a door. Suddenly there were libraries. There were other people's tools, free, right there. I built WhatsApp message spammers and tested them on my friends, who were thrilled. I lived inside YouTube tutorials. I may or may not have skipped a few online classes to work on those projects(in my defense... they were educational) — and somewhere in that stretch, I built the first version of JARVIS.
        - paragraph [ref=f6e77]: He's still around. We'll get to him.
        - heading "The gamedev detour" [level=3] [ref=f6e78]
        - paragraph [ref=f6e79]: Age eleven.
        - paragraph [ref=f6e80]: I was already deep into online games, so of course I wanted to make them.
        - paragraph [ref=f6e81]: Roblox took me in. I learned Lua, got my first exposure to 3D modelling, and — maybe more importantly — found out what it feels like to be part of an online developer community, where nobody knows or cares how old you are as long as the thing works. I made games. My friends played them. I earned a genuinely respectable amount of Robux and spent every last one of it on clothes and accessories, which I regret not at all.
        - paragraph [ref=f6e82]: There was a Unity phase. A brief Android app development phase. Both taught me something and neither stuck. Python remained the great love. Robotics kept running in the background, the way it always has.
        - heading "The channel" [level=3] [ref=f6e83]
        - paragraph [ref=f6e84]: "Age twelve. Circulation: negligible."
        - paragraph [ref=f6e85]:
          - text: I started a YouTube channel to show off the robots I was building.
          - generic [ref=f6e86]: Selected without mercy from the archive.
        - paragraph [ref=f6e88]: The scripts were unhinged. Insanely fun to write, frequently cringe, never once normal — I have always been this specific kind of storyteller and I have made my peace with it. Between robot builds I posted piano covers of the most absurd songs I liked, occasional Hot Wheels reviews, and poetry I'd written myself, because the writing thing was always there too.
        - paragraph [ref=f6e89]: The channel failed. Completely. I had the time of my life.
        - heading "ACE" [level=3] [ref=f6e90]
        - paragraph [ref=f6e91]: Age fourteen. IIT Madras. Runners-up.
        - paragraph [ref=f6e92]:
          - text: Four of us went to IIT Madras for a team competition, and we spent about a month building ACE — an air purifier rover.
          - generic [ref=f6e93]: ACE
        - paragraph [ref=f6e95]:
          - text: This was the first time a project made me
          - emphasis [ref=f6e96]: study
          - text: . Air pollution, air purification, the actual chemistry and airflow of the thing, and then the usual robotics, code, tinkering and research to make it move and work at the same time. Every bad assumption we had got found out by a physical object refusing to cooperate.
        - paragraph [ref=f6e97]: We came away runners-up. I came away with the understanding that a good project is mostly research wearing a robot costume.
        - heading "The school years" [level=3] [ref=f6e98]
        - paragraph [ref=f6e99]: Eleventh grade. Things got serious without my noticing.
        - paragraph [ref=f6e100]:
          - text: I got into AI systems programming with Python, and — for the first time — learned Python properly, academically, in a classroom, after six years of learning it in the wild. Turns out I'd been right about most of it and spectacularly wrong about a few things.
          - generic [ref=f6e101]: First printer, first benchy
        - paragraph [ref=f6e103]: "I became robotics club lead and tech advisor at my school, which meant I stopped just building for myself. I built for the school: a teacher assessment platform, a library management system, a virtual assistant for the STEM lab. I mentored juniors through their robotics projects, exhibitions and competitions — and watching someone else's thing finally work is a very different pleasure from watching your own thing finally work. Both are good. That one's quieter."
        - paragraph [ref=f6e104]:
          - text: I also got my hands on a 3D printer for the first time. I was fascinated. I am
          - emphasis [ref=f6e105]: still
          - text: fascinated. I don't expect that to wear off — a machine that turns a file into an object is the closest thing to real magic I've been allowed to own.
        - paragraph [ref=f6e106]: "And I founded the Student Gymkhana: a student-led body for the school's activities, clubs and events. Which, if you think about it, is just the board game thing again. Write the rules, draw the board, hand it to people, watch it run."
        - heading "Now" [level=3] [ref=f6e107]
        - paragraph [ref=f6e108]:
          - text: I'm at LNMIIT Jaipur, studying CS engineering.
          - generic [ref=f6e109]:
            - img "the bench" [ref=f6e111]
            - generic [ref=f6e112]: There's always another thing on the bench.
        - paragraph [ref=f6e113]: I build AI systems and agentic pipelines that help actual people, not benchmarks. JARVIS MK2 is running — the sixth or seventh descendant of that program a ten-year-old wrote while skipping class, and by far the best-behaved of the lineage. I've built autonomous content creation pipelines. I modernise old tech, because throwing things away is boring. And there's an ebike taking shape, currently on its framework, which is my standing excuse to be covered in grease.
        - paragraph [ref=f6e114]: "Still programming. Still 3D printing. Still soldering. Most importantly: still learning — twelve years in, and the best part of this is still the moment something I don't understand becomes something I do."
        - paragraph [ref=f6e115]: The pencil-drawn robots didn't work. Neither did the channel. The board game company never happened. That's fine — the point was never the shipping. The point is that there's always another thing on the bench.
        - heading "What the editor likes" [level=3] [ref=f6e116]
        - paragraph [ref=f6e117]:
          - text: Films, books, and records this paper will not stop going on about are collected on the
          - link "arts & leisure page" [ref=f6e118] [cursor=pointer]:
            - /url: /culture/
          - text: . The critic is the editor, which explains the reviews.
