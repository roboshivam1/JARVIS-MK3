# =============================================================================
# jarvis-mk3/pyproject.toml
#
# Single source of truth for packaging, dependencies, and tool config.
# Managed with `uv`.
#
# Dependency policy: each roadmap phase adds only the dependencies its code
# actually imports. If a library is not imported anywhere yet, it does not
# belong here yet.
# =============================================================================

[project]
name = "jarvis-mk3"
version = "0.1.0"
description = "JARVIS MK3 - always-on personal AI: Core daemon + intermittent workers"
requires-python = ">=3.12"

# -- Runtime dependencies -----------------------------------------------------
dependencies = [
    "pydantic>=2.7",           # every model, envelope, and schema
    "pydantic-settings>=2.2",  # typed config from env/.env
    "aiosqlite>=0.20",         # async SQLite access for the Core
    "anthropic>=0.40",         # the LLM provider SDK
    "fastapi>=0.111",          # the gateway web framework
    "uvicorn>=0.30",           # the ASGI server that runs the gateway
    "python-multipart>=0.0.9", # multipart form parsing for file uploads
    "aiogram>=3.7",            # Telegram bridge (async-native)
    "voyageai>=0.3",           # embeddings for semantic memory
    "httpx>=0.27",             # embeddings: local Ollama provider, HTTP calls
    "croniter>=2.0",           # cron expression parsing for schedules
]

[project.optional-dependencies]
# Worker-only deps arrive in phase 2 (websockets client, MCP host, etc.)
worker = [
    "websockets>=13.0",        # the worker's outbound link to the Core
    # Available to sandboxed code. Pre-installed rather than pip-installed
    # on demand: installing at run time would need network access, which
    # is the one thing the sandbox most usefully denies.
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "pypdf>=5.0",              # so the sandbox can read PDFs
    "openpyxl>=3.1",           # and spreadsheets
]
# Voice deps arrive in phase 6 (wake word, VAD, TTS)
voice = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "httpx>=0.27",             # test client for the gateway
]

# -- Build system -------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the installable package is src/jarvis -> imported as `jarvis`.
packages = ["src/jarvis"]

[tool.hatch.build.targets.wheel.force-include]
"src/jarvis/core/gateway/static" = "jarvis/core/gateway/static"

# -- Tool configuration -------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jarvis"]
mypy_path = "src"